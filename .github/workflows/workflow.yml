name: Debug Date Field Specific

on: workflow_dispatch

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const query = `
              query {
                organization(login: "COMPASS-DOE") {
                  projectV2(number: 14) {
                    items(first: 100) {
                      nodes {
                        content {
                          ... on Issue {
                            number
                            title
                          }
                        }
                        fieldValues(first: 100) {
                          nodes {
                            ... on ProjectV2ItemFieldDateValue {
                              date
                              field {
                                ... on ProjectV2Field {
                                  name
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const result = await github.graphql(query);
            const items = result.organization.projectV2.items.nodes;

            console.log("Looking for date fields in project:\n");
            
            let dateFieldsFound = 0;
            
            for (const item of items) {
              if (!item.content) continue;
              
              const dateValues = item.fieldValues.nodes.filter(f => f.date);
              
              if (dateValues.length > 0) {
                console.log(`✅ Issue #${item.content.number}: ${item.content.title}`);
                dateValues.forEach(f => {
                  console.log(`   ${f.field.name}: ${f.date}`);
                });
                dateFieldsFound++;
              }
            }
            
            console.log(`\n\nTotal issues with date fields: ${dateFieldsFound}`);
