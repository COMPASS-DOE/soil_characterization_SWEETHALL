name: Debug Field Types

on: workflow_dispatch

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const query = `
              query {
                organization(login: "COMPASS-DOE") {
                  projectV2(number: 14) {
                    items(first: 100) {
                      nodes {
                        content {
                          ... on Issue {
                            number
                            title
                          }
                        }
                        fieldValues(first: 50) {
                          nodes {
                            __typename
                            ... on ProjectV2ItemFieldDateValue {
                              date
                              field {
                                ... on ProjectV2Field {
                                  name
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const result = await github.graphql(query);
            const items = result.organization.projectV2.items.nodes;

            console.log("Checking Issue #30 (SWH HYPROP):");
            const issue30 = items.find(i => i.content && i.content.number === 30);
            
            if (issue30) {
              console.log(`Field values: ${JSON.stringify(issue30.fieldValues.nodes, null, 2)}`);
            }
