name: Due Date Reminder

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 2);
            const targetDate = tomorrow.toISOString().split('T')[0];
            
            console.log(`🔍 Looking for issues due on: ${targetDate}`);

            const query = `
              query($endCursor: String) {
                organization(login: "COMPASS-DOE") {
                  projectV2(number: 14) {
                    items(first: 100, after: $endCursor) {
                      pageInfo {
                        hasNextPage
                        endCursor
                      }
                      nodes {
                        content {
                          ... on Issue {
                            number
                            title
                            repository {
                              nameWithOwner
                            }
                          }
                        }
                        fieldValues(first: 50) {
                          nodes {
                            ... on ProjectV2ItemFieldDateValue {
                              date
                              field {
                                ... on ProjectV2Field {
                                  name
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const result = await github.graphql(query);
            const items = result.organization.projectV2.items.nodes;

            console.log(`📋 Found ${items.length} items in project`);

            for (const item of items) {
              if (!item.content) continue;

              // Log all field values for debugging
              const dateFields = item.fieldValues.nodes.filter(f => f.date);
              
              if (dateFields.length > 0) {
                console.log(`\n📌 Issue #${item.content.number}: ${item.content.title}`);
                dateFields.forEach(f => {
                  console.log(`   ${f.field.name}: ${f.date}`);
                  
                  if (f.date === targetDate && f.field.name === 'Target date') {
                    console.log(`   ✅ MATCH!`);
                  }
                });
              }

              const dueField = item.fieldValues.nodes.find(
                f => f.date === targetDate && f.field.name === 'Target date'
              );

              if (dueField) {
                const issue = item.content;
                const [owner, repo] = issue.repository.nameWithOwner.split('/');

                console.log(`\n✅ Creating comment on #${issue.number}`);

                const comments = await github.rest.issues.listComments({
                  owner,
                  repo,
                  issue_number: issue.number
                });

                if (!comments.data.some(c => c.body.includes('⏰'))) {
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: issue.number,
                    body: `⏰ Reminder: This is due in 2 days (${targetDate})`
                  });
                  console.log(`Comment created!`);
                }
              }
            }
