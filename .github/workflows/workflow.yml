name: Debug Project Fields

on: workflow_dispatch

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const query = `
              query {
                organization(login: "COMPASS-DOE") {
                  projectV2(number: 14) {
                    items(first: 5) {
                      nodes {
                        content {
                          ... on Issue {
                            number
                            title
                          }
                        }
                        fieldValues(first: 20) {
                          nodes {
                            ... on ProjectV2ItemFieldDateValue {
                              date
                              field {
                                ... on ProjectV2Field {
                                  name
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const result = await github.graphql(query);
            const items = result.organization.projectV2.items.nodes;
            
            for (const item of items) {
              console.log(`\n📌 Issue #${item.content.number}: ${item.content.title}`);
              console.log(`Fields:`, JSON.stringify(item.fieldValues.nodes, null, 2));
            }
