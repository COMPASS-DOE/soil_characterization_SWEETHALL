name: Due Date Reminder

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 2);
            const targetDate = tomorrow.toISOString().split('T')[0];
            
            console.log(`🔍 Looking for issues due on: ${targetDate}`);

            const query = `
              query {
                organization(login: "COMPASS-DOE") {
                  projectV2(number: 14) {
                    items(first: 100) {
                      nodes {
                        id
                        content {
                          ... on Issue {
                            number
                            title
                            repository {
                              nameWithOwner
                            }
                          }
                        }
                        fieldValues(first: 50) {
                          nodes {
                            ... on ProjectV2ItemFieldDateValue {
                              date
                              field {
                                ... on ProjectV2Field {
                                  id
                                  name
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const result = await github.graphql(query);
            const items = result.organization.projectV2.items.nodes;

            console.log(`📋 Found ${items.length} items in project`);
            
            let matchCount = 0;

            for (const item of items) {
              if (!item.content) {
                console.log(`Skipping item with no content`);
                continue;
              }

              console.log(`\n📌 Checking Issue #${item.content.number}: ${item.content.title}`);
              console.log(`   Field values count: ${item.fieldValues.nodes.length}`);
              
              for (const fieldValue of item.fieldValues.nodes) {
                if (fieldValue.date) {
                  console.log(`   Found date field: ${fieldValue.field.name} = ${fieldValue.date}`);
                  
                  if (fieldValue.date === targetDate && fieldValue.field.name === 'Target date') {
                    console.log(`   ✅ MATCH FOUND!`);
                    matchCount++;
                    
                    const issue = item.content;
                    const [owner, repo] = issue.repository.nameWithOwner.split('/');

                    const comments = await github.rest.issues.listComments({
                      owner,
                      repo,
                      issue_number: issue.number
                    });

                    if (!comments.data.some(c => c.body.includes('⏰'))) {
                      console.log(`   Creating comment...`);
                      await github.rest.issues.createComment({
                        owner,
                        repo,
                        issue_number: issue.number,
                        body: `⏰ Reminder: This is due in 2 days (${targetDate})`
                      });
                      console.log(`   ✅ Comment created!`);
                    }
                  }
                }
              }
            }
            
            console.log(`\n✅ Total matches found: ${matchCount}`);
